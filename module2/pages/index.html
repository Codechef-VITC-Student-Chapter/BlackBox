<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKBOX OS - System integrity Check</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/terminal.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <!-- Ambient Cursor Glow & Cyber Grid -->
  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>
  <div class="cyber-grid"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="os-container page-fade-enter">
    <!-- OS Header -->
    <header class="os-header">
      <div class="header-left">
        <span class="text-cyan">BLACKBOX_OS // </span><span>M2_RECOVERY</span>
      </div>
      <div class="system-status">
        <span class="status-indicator offline" id="status-indicator"></span>
        <span class="text-muted" id="status-text">SYSTEM CORRUPTED</span>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-content">
      <div class="glass-panel" style="width: 100%; max-width: 900px; display: grid; grid-template-columns: 1.8fr 1fr; gap: 2rem;">
        
        <!-- Left: Terminal -->
        <div>
          <div class="terminal-window">
            <div class="terminal-header">
              <div class="terminal-controls">
                <span class="terminal-dot close"></span>
                <span class="terminal-dot minimize"></span>
                <span class="terminal-dot maximize"></span>
              </div>
              <div>boot_diagnostics.log</div>
            </div>
            <div class="terminal-body" id="terminal-body">
              <!-- Dynamically populated by boot.js -->
            </div>
          </div>
        </div>

        <!-- Right: Diagnostic Sidebar -->
        <div class="diagnostics-panel">
          <div class="diag-title">SYSTEM DIAGNOSTICS</div>
          <div class="diag-grid">
            <div class="diag-card">
              <div class="diag-label">OS KERNEL</div>
              <div class="diag-value glow-cyan">SECURE_v1.0</div>
            </div>
            <div class="diag-card">
              <div class="diag-label">IP ADDRESS</div>
              <div class="diag-value text-muted">10.244.11.89</div>
            </div>
            <div class="diag-card">
              <div class="diag-label">INTEGRITY</div>
              <div class="diag-value glow-danger" id="integrity-status">CHECKING...</div>
            </div>
            <div class="diag-card">
              <div class="diag-label">MIRRORS</div>
              <div class="diag-value">1 / 3 ONLINE</div>
            </div>
          </div>

          <div style="margin-top: auto; padding: 1rem 0;">
            <div class="cyber-label" style="margin-bottom: 8px;">INTEGRITY RECONSTRUCTION PROGRESS</div>
            <div class="progress-container" style="margin-bottom: 12px;">
              <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.8rem;">
              <span class="text-muted">Analyzing sectors...</span>
              <span class="text-cyan" id="progress-percent">0%</span>
            </div>
          </div>

          <button class="btn-cyber" id="begin-btn" disabled style="width: 100%; opacity: 0.5; transition: opacity 0.5s ease;">
            BEGIN INVESTIGATION
          </button>
        </div>

      </div>
    </main>

    <!-- OS Footer -->
    <footer class="os-footer">
      <div>SECURE CONNECTION // MODULE_02</div>
      <div id="footer-time">SESSION_TIME: 20:53:43</div>
    </footer>
  </div>

  <script src="/js/boot.js"></script>
  <script>
    // Live footer clock
    function updateClock() {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      const footerTime = document.getElementById('footer-time');
      if (footerTime) {
        footerTime.innerText = `SESSION_TIME: ${timeStr}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
